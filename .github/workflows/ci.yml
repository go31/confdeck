name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: 检查内嵌 UI 还在（避免有人删了 web/ 才发现）
        run: |
          go build -o /tmp/confdeckd ./cmd/confdeckd
          /tmp/confdeckd -version
